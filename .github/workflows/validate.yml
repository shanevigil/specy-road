name: Validate roadmap

# This workflow doubles as a reusable pipeline. The release-publish
# workflow calls it via `uses: ./.github/workflows/validate.yml` so a
# tag-driven release re-runs the same gates the PR did before publish.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_call:

# Read-only token: checkout, audits, artifact upload and tests need no write.
# release-publish.yml calls this workflow; a called workflow may only narrow
# the caller's grant.
permissions:
  contents: read

jobs:
  roadmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the promotion range check reads every reachable commit; a shallow clone cannot decide
      - name: Assert packaged Gantt UI static assets exist
        run: test -f specy_road/pm_gantt_static/index.html
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python dependencies (frozen lock)
        run: |
          pip install -r requirements-ci.txt
      - name: Upgrade pip (toolchain; avoids auditing old pip CVEs)
        run: python -m pip install --upgrade 'pip>=25.3'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit Python dependencies (pip-audit)
        id: pip_audit
        run: |
          set +e
          # CVE-2026-3219 currently affects every published pip release.
          # Keep auditing repo dependencies while the toolchain awaits a fix.
          pip-audit -f json -o pip-audit-results.json --ignore-vuln CVE-2026-3219
          echo $? > pip-audit.exitcode
          set -e
      - name: Upload pip-audit JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-results
          path: pip-audit-results.json
          if-no-files-found: ignore
      - name: Enforce pip-audit exit code
        run: test "$(cat pip-audit.exitcode)" -eq 0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gui/pm-gantt/package-lock.json
      - name: Validate npm lockfile (lockfile-lint)
        run: |
          npx --yes lockfile-lint@4.14.0 \
            --path gui/pm-gantt/package-lock.json \
            --allowed-hosts npm \
            --allowed-schemes https:
      - name: Install and audit Gantt UI npm dependencies
        working-directory: gui/pm-gantt
        run: |
          npm ci
          set +e
          npm audit --omit=dev --json | tee ../../npm-audit-results.json
          echo ${PIPESTATUS[0]} > ../../npm-audit.exitcode
          set -e
      - name: Upload npm audit JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-results
          path: npm-audit-results.json
          if-no-files-found: ignore
      - name: Enforce npm audit exit code
        run: test "$(cat npm-audit.exitcode)" -eq 0
      - name: PM Gantt ESLint
        working-directory: gui/pm-gantt
        run: npm run lint
      - name: PM Gantt unit tests (Vitest)
        working-directory: gui/pm-gantt
        run: npm test
      - name: PM Gantt production build
        working-directory: gui/pm-gantt
        run: npm run build
      - name: Enforce PM Gantt bundle budget
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          budget_bytes = 900_000
          assets = sorted(
              Path("specy_road/pm_gantt_static/assets").glob("index-*.js")
          )
          if not assets:
              print("error: no built PM Gantt index chunk found")
              sys.exit(1)
          latest = max(assets, key=lambda p: p.stat().st_mtime)
          size = latest.stat().st_size
          print(f"PM Gantt entry chunk: {latest} ({size} bytes)")
          if size > budget_bytes:
              print(
                  f"error: PM Gantt entry chunk exceeds budget "
                  f"({size} > {budget_bytes} bytes)"
              )
              sys.exit(1)
          PY
      - name: Install OSV-Scanner
        run: |
          curl -sSL -o /usr/local/bin/osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.3.5/osv-scanner_linux_amd64
          chmod +x /usr/local/bin/osv-scanner
      - name: OSV-Scanner (lockfiles)
        run: |
          osv-scanner scan \
            -L requirements-ci.txt \
            -L gui/pm-gantt/package-lock.json \
            --format json \
            --output-file osv-scanner-results.json
      - name: Upload OSV-Scanner JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: osv-scanner-results
          path: osv-scanner-results.json
          if-no-files-found: ignore
      - name: Validate roadmap and registry (dogfood fixture)
        run: python specy_road/bundled_scripts/validate_roadmap.py --repo-root tests/fixtures/specy_road_dogfood
      - name: Check roadmap markdown export (dogfood fixture)
        run: python specy_road/bundled_scripts/export_roadmap_md.py --check --repo-root tests/fixtures/specy_road_dogfood
      - name: File limits
        run: python specy_road/bundled_scripts/validate_file_limits.py
      - name: Install lean-code gate tools (ruff, pylint)
        run: pip install ruff==0.17.3 pylint==4.1.3
      - name: Lean-code gate - complexity (ruff C901, max 10; baseline is a per-function noqa)
        run: ruff check specy_road tests scripts
      - name: Lean-code gate - new clone pairs (pylint R0801 vs constraints/clone-baseline.json)
        run: python scripts/check_clones.py
      - name: Lean-code gate - private imports in tests (vs constraints/test-private-imports-baseline.txt)
        run: python scripts/check_test_private_imports.py
      # Advisory: the findings show in the log and never fail the job. vulture is
      # exact-pinned in the dev extra (requirements-ci.txt); routes, hooks and kept
      # names are listed in scripts/vulture_whitelist.py, which the run reads.
      - name: Dead code (vulture, 60% confidence, advisory)
        continue-on-error: true
        run: vulture specy_road scripts --min-confidence 60
      # Tracked files on every run. A pull request or branch push also checks the
      # messages of its range, and one to main adds --promotion: every newly
      # reachable commit (side branches included, merges diffed with -m) is
      # refused for an addition, modification or rename onto a denied path;
      # a deletion passes, and the message and identity checks apply. The
      # script and allowlist are the base commit's when that commit has them,
      # so a candidate-local widening does not apply. A workflow_call run (a
      # tag push or dispatch in the caller) checks files only: it has no range.
      - name: Public hygiene - personal data, machine setup and process content
        env:
          PUBLIC_HYGIENE_LOCAL: ${{ secrets.PUBLIC_HYGIENE_LOCAL }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          args=()
          base=""
          promotion=0
          if [ "$EVENT" = pull_request ]; then
            args+=(--range "$PR_BASE..$PR_HEAD")
            base="$PR_BASE"
            if [ "$BASE_REF" = main ]; then promotion=1; fi
          elif [ "$EVENT" = push ] && [[ "$REF" == refs/heads/* ]]; then
            args+=(--range "$BEFORE..$SHA")
            base="$BEFORE"
            if [ "$REF" = refs/heads/main ]; then promotion=1; fi
          fi
          script="scripts/check_public_hygiene.py"
          if [ "$promotion" = 1 ]; then
            args+=(--promotion)
            policy="$(mktemp -d)"
            if git cat-file -e "${base}:scripts/check_public_hygiene.py" 2>/dev/null; then
              git show "${base}:scripts/check_public_hygiene.py" > "$policy/check_public_hygiene.py"
              script="$policy/check_public_hygiene.py"
              export PUBLIC_HYGIENE_FROM_BASE=1
            fi
            if git cat-file -e "${base}:scripts/public_hygiene_allow.txt" 2>/dev/null; then
              git show "${base}:scripts/public_hygiene_allow.txt" > "$policy/public_hygiene_allow.txt"
              export PUBLIC_HYGIENE_ALLOW="$policy/public_hygiene_allow.txt"
            fi
          fi
          python "$script" --root "$GITHUB_WORKSPACE" "${args[@]}"
      # [tool.coverage.*] in pyproject.toml is the whole configuration: source,
      # branch arcs, subprocess capture and fail_under. `coverage report` exits
      # non-zero below fail_under; the branch percentage is informational.
      - name: Tests under coverage (fails below the coverage floor)
        run: |
          coverage run -m pytest -n auto
          coverage combine -q
          coverage json -q -o work/coverage.json --fail-under=0
          python -c "import json; t = json.load(open('work/coverage.json'))['totals']; print(f\"Branch coverage (informational): {100 * t['covered_branches'] / t['num_branches']:.2f}%\")"
          coverage report
