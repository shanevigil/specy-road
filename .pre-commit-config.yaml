# See https://pre-commit.com — install: pip install pre-commit && pre-commit install
# and, for the commit-message check, pre-commit install --hook-type commit-msg

# Hooks without `stages` run on commit only, not again at the commit-msg stage.
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: validate-roadmap
        name: validate roadmap and registry
        entry: python specy_road/bundled_scripts/validate_roadmap.py --repo-root tests/fixtures/specy_road_dogfood
        language: system
        pass_filenames: false
        always_run: true
      - id: export-roadmap-md-check
        name: check roadmap markdown export (drift)
        entry: python specy_road/bundled_scripts/export_roadmap_md.py --check --repo-root tests/fixtures/specy_road_dogfood
        language: system
        pass_filenames: false
        always_run: true
      - id: validate-file-limits
        name: validate file line-count limits
        entry: python specy_road/bundled_scripts/validate_file_limits.py
        language: system
        pass_filenames: false
        always_run: true
      - id: lean-complexity
        name: lean-code gate - complexity (ruff C901)
        entry: ruff check specy_road tests scripts
        language: system
        pass_filenames: false
        always_run: true
      - id: lean-clones
        name: lean-code gate - new clone pairs (pylint R0801)
        entry: python scripts/check_clones.py
        language: system
        pass_filenames: false
        always_run: true
      - id: lean-test-private-imports
        name: lean-code gate - private imports in tests
        entry: python scripts/check_test_private_imports.py
        language: system
        pass_filenames: false
        always_run: true
      - id: public-hygiene
        name: no personal data, machine setup or process content in tracked files
        entry: python scripts/check_public_hygiene.py
        language: system
        pass_filenames: false
        always_run: true
      - id: public-hygiene-commit-msg
        name: no personal data, machine setup or process content in the commit message
        entry: python scripts/check_public_hygiene.py --commit-msg
        language: system
        stages: [commit-msg]
