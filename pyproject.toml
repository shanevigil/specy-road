[build-system]
requires = ["setuptools>=61.2"]
build-backend = "setuptools.build_meta"

[project]
name = "specy-road"
# Canonical version: `specy_road.__version__` prefers this file when the
# package lives under this repo; else importlib.metadata; else `0.0.0+unknown`.
version = "0.2.3"
description = "Roadmap-first coordination kit for humans and AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.20",
  # The dev task loop needs this, not just the PM GUI: do_next_available imports
  # roadmap_gui_remote for forge enrichment (MR-rejected pickup tier), so
  # do-next-available-task, grind-session, abort-task-pickup,
  # mark-implementation-reviewed and finish-this-task all fail to import without
  # it on a plain `pip install specy-road`.
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "fastapi>=0.115",
  # Required by starlette.testclient.TestClient (tests/test_gui_app.py); not a transitive install.
  "httpx>=0.27",
  "requests>=2.31",
]
review = [
  "openai>=1.40",
  "anthropic>=0.40",
]
gui = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "requests>=2.31",
  "openai>=1.40",
  "anthropic>=0.40",
]
gui-next = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "requests>=2.31",
  "openai>=1.40",
  "anthropic>=0.40",
]

[project.scripts]
specy-road = "specy_road.cli:main"
specyrd = "specy_road.specyrd_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["specy_road*"]

[tool.setuptools.package-data]
# `*` does not match a leading dot, so every dotfile in the scaffold needs its
# own entry. Without one it is dropped from the wheel silently: `init project`
# copies whatever is on disk, so an editable checkout still scaffolds correctly
# and only pip-installed users see the gap. scripts/verify_wheel_contents.py and
# tests/test_package_data_dotfiles.py guard against adding another.
specy_road = [
  "templates/**/*",
  "templates/project/**/*",
  "templates/project/.gitignore",
  "templates/project/work/.gitkeep",
  "pm_gantt_static/**/*",
  # Toolkit-owned schemas validated from the wheel rather than from
  # <repo_root>/schemas/, so adopters get new archive fields by upgrading the
  # package instead of hand-editing a consumer-owned schema.
  "schemas/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
# Lean-code gate (docs/contributor-guide.md, "Lean-code gates"). Only the
# complexity rule is selected on purpose: the ruff default set is not clean on
# this tree and is out of scope for this gate.
target-version = "py311"

[tool.ruff.lint]
select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# C901 baseline 2026-10-28; remove entries as functions are simplified.
"specy_road/bundled_scripts/brainstorm_fields.py" = ["C901"]
"specy_road/bundled_scripts/do_next_available.py" = ["C901"]
"specy_road/bundled_scripts/do_next_finished_unmerged.py" = ["C901"]
"specy_road/bundled_scripts/grind_session_events.py" = ["C901"]
"specy_road/bundled_scripts/llm_throughput.py" = ["C901"]
"specy_road/bundled_scripts/migrate_stable_node_keys.py" = ["C901"]
"specy_road/bundled_scripts/models_cli.py" = ["C901"]
"specy_road/bundled_scripts/review_cli.py" = ["C901"]
"specy_road/bundled_scripts/roadmap_edit_fields.py" = ["C901"]
"specy_road/bundled_scripts/roadmap_gui_lib.py" = ["C901"]
"specy_road/bundled_scripts/roadmap_rebalance.py" = ["C901"]
"specy_road/bundled_scripts/role_prompt.py" = ["C901"]
"specy_road/bundled_scripts/validate_self_heal.py" = ["C901"]
"specy_road/file_limits_engine.py" = ["C901"]
"specy_road/gui_app_routes_nodes.py" = ["C901"]
"specy_road/init_project.py" = ["C901"]
"specy_road/model_profiles.py" = ["C901"]
"specy_road/search_fallback.py" = ["C901"]
"specy_road/specyrd_cli.py" = ["C901"]
"specy_road/specyrd_skills.py" = ["C901"]
"specy_road/tool_call_guard.py" = ["C901"]
