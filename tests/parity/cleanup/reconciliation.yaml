# The reconciliation table (M16.4.1): the action and reason for each fixture row (fixture.py) under
# each old cleanup command and each new form. `old` names the command's column in
# golden/old_selections.json (recorded before the planner); `rows` is what the command selects now,
# from the one planner (specy_road/cleanup_plan.py); `decided` explains every row whose action
# differs from the old column, and each is a reduction (never a new removal). A row a command does
# not name is not in its `rows`. test_reconciliation.py holds the commands to this table.
commands:
  branches prune:
    old: branches prune
    rows:
      complete-branch:local:
        action: remove
        reason: merged into origin/dev and unclaimed
      complete-branch:origin:
        action: remove
        reason: merged into origin/dev and unclaimed
      merged-branch:origin:
        action: remove
        reason: merged into origin/dev and unclaimed
      merged-dirty-worktree:origin:
        action: remove
        reason: merged into origin/dev and unclaimed
    decided:
      merged-branch:local: 'Old branches prune listed it; with --delete, git branch -d refused it (checked
        out in work/.worktrees/merged). Not listed now: the planner keeps a local branch that a worktree
        this run does not remove has checked out: git refuses to delete it. Safety: selects less.'
      merged-dirty-worktree:local: 'Same as merged-branch:local (checked out in work/.worktrees/dirty).
        Safety: selects less.'
  registry-prune:
    old: registry-prune
    rows:
      row-complete:
        action: list
        reason: no feature branch in this clone
      row-no-branch:
        action: list
        reason: no feature branch in this clone
    notes:
      row-complete: registry-prune only reports; it removes a row only when named (--remove). doctor --prune
        --kind registry removes this row itself.
  worktree prune M1.1:
    old: worktree prune M1.1
    rows:
      live-worktree:
        action: keep
        reason: 'feature/rm-thing live: claimed by M1.1; finish or release it first'
    decided:
      live-worktree: 'Old worktree prune would remove the worktree of a fresh claim: its tip is the integration
        tip, so it is merged by ancestry and clean. The planner''s live rule holds it (claimed by M1.1),
        as doctor always did. Safety: selects less.'
  worktree prune M1.2:
    old: worktree prune M1.2
    rows:
      merged-clean-worktree:
        action: remove
        reason: merged and holds no unsaved work
  worktree prune M1.3:
    old: worktree prune M1.3
    rows:
      merged-dirty-worktree:
        action: keep
        reason: 'uncommitted or untracked: src/dirty.py'
  doctor --prune:
    old: doctor
    rows:
      complete-branch:local:
        action: remove
        reason: merged
      complete-branch:origin:
        action: remove
        reason: merged
      live-worktree:
        action: keep
        reason: 'branch feature/rm-thing live: claimed by M1.1, so --prune leaves it'
      merged-branch:local:
        action: remove
        reason: merged
      merged-branch:origin:
        action: remove
        reason: merged
      merged-clean-worktree:
        action: remove
        reason: branch feature/rm-merged is merged
      merged-dirty-worktree:
        action: keep
        reason: branch feature/rm-dirty is merged; uncommitted changes, so --prune leaves it
      merged-dirty-worktree:local:
        action: keep
        reason: merged; checked out in <REPO>/work/.worktrees/dirty, so --prune leaves it
      merged-dirty-worktree:origin:
        action: remove
        reason: merged
      row-complete:
        action: remove
        reason: 'node M1.6: leaf Complete'
      row-no-branch:
        action: keep
        reason: 'node M1.7: feature/rm-ghost is in neither this clone nor origin (advisory: another clone''s
          claim looks the same until it pushes its branch; confirm that clone no longer holds the claim,
          then specy-road registry-prune --remove ghost), so --prune leaves it'
      toolkit-stash:
        action: remove
        reason: 'On dev: specy-road: temp stash work/ around pickup'
      unmerged-branch:local:
        action: remove
        reason: 'claim gone, not merged: 1 commit(s) origin/dev lacks'
      unmerged-branch:origin:
        action: remove
        reason: 'claim gone, not merged: 1 commit(s) origin/dev lacks'
    decided:
      merged-dirty-worktree: 'Old doctor planned it, but git worktree remove refuses uncommitted changes,
        so --fix failed on it. The planner keeps a worktree with uncommitted changes (worktree prune M1.3
        always refused it). Safety: selects less.'
      merged-dirty-worktree:local: 'Old doctor planned it, but git branch -D refuses a branch a worktree
        has checked out, so --fix failed on it; the planner keeps a local branch that a worktree this
        run does not remove has checked out: git refuses to delete it. Safety: selects less.'
  doctor --prune --kind branches:
    old: null
    rows:
      complete-branch:local:
        action: remove
        reason: merged
      complete-branch:origin:
        action: remove
        reason: merged
      merged-branch:local:
        action: keep
        reason: merged; checked out in <REPO>/work/.worktrees/merged, so --prune leaves it
      merged-branch:origin:
        action: remove
        reason: merged
      merged-dirty-worktree:local:
        action: keep
        reason: merged; checked out in <REPO>/work/.worktrees/dirty, so --prune leaves it
      merged-dirty-worktree:origin:
        action: remove
        reason: merged
      unmerged-branch:local:
        action: remove
        reason: 'claim gone, not merged: 1 commit(s) origin/dev lacks'
      unmerged-branch:origin:
        action: remove
        reason: 'claim gone, not merged: 1 commit(s) origin/dev lacks'
    notes:
      merged-branch:local: Under --kind branches alone the worktree on it is not removed, so the branch
        stays; doctor --prune (every kind) removes the worktree first, then the branch.
      unmerged-branch:local: 'Unchanged from doctor --fix: an unclaimed branch with commits of its own
        is offered whether or not it is merged. branches prune and the grind cleanup never select it (their
        scope is merged by ancestry).'
  doctor --prune --kind worktrees:
    old: null
    rows:
      live-worktree:
        action: keep
        reason: 'branch feature/rm-thing live: claimed by M1.1, so --prune leaves it'
      merged-clean-worktree:
        action: remove
        reason: branch feature/rm-merged is merged
      merged-dirty-worktree:
        action: keep
        reason: branch feature/rm-dirty is merged; uncommitted changes, so --prune leaves it
  doctor --prune --kind registry:
    old: null
    rows:
      row-complete:
        action: remove
        reason: 'node M1.6: leaf Complete'
      row-no-branch:
        action: keep
        reason: 'node M1.7: feature/rm-ghost is in neither this clone nor origin (advisory: another clone''s
          claim looks the same until it pushes its branch; confirm that clone no longer holds the claim,
          then specy-road registry-prune --remove ghost), so --prune leaves it'
  doctor --prune --kind stashes:
    old: null
    rows:
      toolkit-stash:
        action: remove
        reason: 'On dev: specy-road: temp stash work/ around pickup'
  grind-session --delete-merged-branches:
    old: grind-session --delete-merged-branches
    rows:
      claimed-branch:local:
        action: keep
        reason: live
      complete-branch:local:
        action: remove
        reason: deleted
      complete-branch:origin:
        action: remove
        reason: deleted
      merged-branch:local:
        action: keep
        reason: branch_d
      merged-dirty-worktree:local:
        action: keep
        reason: branch_d
      unmerged-branch:local:
        action: keep
        reason: merge_base
    notes:
      claimed-branch:local: 'Same action; the reason is now the live rule (live: claimed by M1.1) instead
        of git branch -d refusing a checked-out branch.'
