  - old: specy-road
    new: specy-road
    allowed: "M16.4.1: top-level help drops `branches prune`, `registry-prune` and `--delete-merged-branches`, and names `doctor --prune --kind`"
  - old: specy-road refresh-stubs
    new: specy-road upgrade --only stubs
