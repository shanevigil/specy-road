# The only way a later leaf may change the command surface or a golden --help transcript.
# Each row is applied to the golden inventory as a declared delta (tests/parity/command_map.py):
# an old invocation's options may be lost, an old command without options may be gone, a new
# invocation's options may be gained, a new command is added. Any other difference fails. Fields:
#   old: the invocation before the change ("specy-road branches prune"); empty for an addition
#   new: the invocation after it ("specy-road doctor --prune"); empty for a removal
#   allowed: the difference this row allows, in one line
rows:
  - old: ""
    new: specy-road worker recover
    allowed: "M22.39: new `worker recover W` subcommand (end a stalled worker, keep its work, resume its session)"
  - old: specy-road worker
    new: specy-road worker
    allowed: "M22.39: `worker --help` lists the new recover subcommand"
  - old: specy-road upgrade
    new: specy-road upgrade
    allowed: "M22.35: upgrade --help says the mirror leaves gitignored files out"
  - old: ""
    new: specy-road review operator-decision
    allowed: "M22.51: new `review operator-decision` subcommand (the coordinator records an operator's review decision)"
  - old: specy-road review
    new: specy-road review
    allowed: "M22.51: `review --help` lists the new operator-decision subcommand"
  - old: specy-road decisions add
    new: specy-road decisions add
    allowed: "M22.51: `decisions add --kind` gains standing-rule; --why, --id and --expires help name it"
