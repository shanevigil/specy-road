# The only way a later leaf may change the command surface or a golden --help transcript.
# Add a row only when your leaf's plan (its acceptance or sheet) names that command change: the planner
# identifies map changes. If you think a row is needed and your plan does not name it, do not add it:
# record it in your implementation summary (or as blocked_on in READY when an acceptance item depends on it);
# the coordinator checks it for goal-post moving and asks a planner for a follow-up leaf.
# Each row is applied to the golden inventory as a declared delta (tests/parity/command_map.py):
# an old invocation's options may be lost, an old command without options may be gone, a new
# invocation's options may be gained, a new command is added. Any other difference fails. Fields:
#   old: the invocation before the change ("specy-road branches prune"); empty for an addition
#   new: the invocation after it ("specy-road doctor --prune"); empty for a removal
#   allowed: the difference this row allows, in one line
rows:
  - old: ""
    new: specy-road worker recover
    allowed: "M22.39: new `worker recover W` subcommand (end a stalled worker, keep its work, resume its session)"
  - old: specy-road worker
    new: specy-road worker
    allowed: "M22.39: `worker --help` lists the new recover subcommand"
  - old: specy-road upgrade
    new: specy-road upgrade
    allowed: "M22.35: upgrade --help says the mirror leaves gitignored files out"
  - old: ""
    new: specy-road review operator-decision
    allowed: "M22.51: new `review operator-decision` subcommand (the coordinator records an operator's review decision)"
  - old: specy-road review
    new: specy-road review
    allowed: "M22.51: `review --help` lists the new operator-decision subcommand"
  - old: specy-road decisions add
    new: specy-road decisions add
    allowed: "M22.51: `decisions add --kind` gains standing-rule; --why, --id and --expires help name it"
  - old: specy-road ready
    new: specy-road ready --fix-of
    allowed: "M22.52: `ready --fix-of MODEL@SHA` names the one block a fix commit answers"
  - old: specy-road grind-session
    new: specy-road grind-session --status --watch
    allowed: "M22.68: `grind-session --status [--watch [MINUTES]]` read-only status report (scope, buckets, estimate, decisions, sessions)"
  - old: specy-road decisions add
    new: specy-road decisions add --criterion
    allowed: "M22.69: `decisions add --criterion A#` opens a human-action entry for a leaf's `human:` acceptance criterion"
  - old: specy-road decisions
    new: specy-road decisions
    allowed: "M22.69: `decisions --help`'s close line says an entry with a criterion closes only at a person's terminal"
  - old: specy-road doctor --fix
    new: specy-road doctor --prune --kind
    allowed: "M16.4.1: `doctor --prune` (with `--kind branches|worktrees|registry|stashes`) is the one cleanup path; `--fix` is a hidden deprecated alias of `--prune`"
  - old: specy-road branches prune
    new: specy-road doctor --prune --kind
    allowed: "M16.4.1: `branches prune` is a hidden deprecated alias of `doctor --prune --kind branches`; its help says so"
  - old: specy-road registry-prune
    new: specy-road doctor --prune --kind
    allowed: "M16.4.1: `registry-prune` is a hidden deprecated alias of `doctor --prune --kind registry`; its help says so"
  - old: specy-road grind-session --delete-merged-branches
