# Recorded with the legacy keys at pickup of M16.4.5 (base 261e2318), before `checks:` existed.
# Columns and the PROBE placeholder: see test_checks_migration.py. `checks` is the hand-written
# equivalent of `legacy`; null means no config line. `cli` is the --baseline-cmd or
# --land-check-cmd value (null: not given; "": disables the check for that run).
rows:
- id: baseline-absent
  stage: baseline
  legacy: null
  checks: null
  cli: null
  expect:
    runs: []
    printed: []
    ok: true
- id: baseline-blank
  stage: baseline
  legacy: |
    baseline_cmd: '  '
  checks: |
    checks: []
  cli: null
  expect:
    runs: []
    printed: []
    ok: true
- id: baseline-set
  stage: baseline
  legacy: |
    baseline_cmd: PROBE baseline
  checks: |
    checks:
      - {name: baseline, run: 'PROBE baseline', when: baseline}
  cli: null
  expect:
    runs: [{"argv": ["baseline"], "cwd": "project", "env_added": []}]
    printed: ["baseline on main: PROBE baseline"]
    ok: true
- id: baseline-set-failing
  stage: baseline
  legacy: |
    baseline_cmd: PROBE baseline fail
  checks: |
    checks:
      - {name: baseline, run: 'PROBE baseline fail', when: baseline}
  cli: null
  expect:
    runs: [{"argv": ["baseline", "fail"], "cwd": "project", "env_added": []}]
    printed: ["baseline on main: PROBE baseline fail"]
    ok: false
