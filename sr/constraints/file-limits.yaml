# Line limits for the specy-road toolkit source (not consumer app repos).

max_lines_per_file: 400
max_lines_per_function: 80
applies_to_globs:
  - "specy_road/bundled_scripts/**/*.py"
  - "specy_road/*.py"
  - "tests/**/*.py"
  - "docs/**/*.md"

# Advisory LLM review: brief assembly, shared/ catalog, and provider clients in one script.
override_limits:
  - name: review_node_advisory_llm
    file_globs:
      - "specy_road/bundled_scripts/review_node.py"
    max_lines_per_file: 900
  - name: set_gate_status_fixture
    file_globs:
      - "tests/test_set_gate_status.py"
    max_lines_per_function: 120
  # CRUD CLI tests share fixtures (`_fixture_repo`, `_run_crud`); splitting
  # for the file cap would force duplicating those helpers across multiple
  # test files. Adding chunk-routing CRUD tests in v0.1.1 took the file
  # past the 400-line cap.
  - name: roadmap_crud_tests
    file_globs:
      - "tests/test_roadmap_crud.py"
    max_lines_per_file: 600
  # Canonical release playbook. Single-file by design so operators can
  # Ctrl+F during a release rather than navigate cross-doc links — which
  # means it grows whenever the release process gains a documented step or
  # recovery path. Raised to 900 when footgun ⑨ (environment approval)
  # was added after a required reviewer silently stalled v0.1.4-rc2, and
  # again when the pypi/testpypi reviewer polarity was corrected.
  - name: release_runbook
    file_globs:
      - "docs/release-runbook.md"
    max_lines_per_file: 900
  # Reference for one command whose surface keeps growing: plan buckets, the
  # loop, implement/pre-finish hooks, stop conditions, exit codes and the JSON
  # event stream all have to be documented where an operator reads about
  # `grind-session`. It sat one line under the 400 cap, so the plan-versus-
  # pickup section that a consumer evaluation asked for did not fit.
  - name: grind_session_reference
    file_globs:
      - "docs/grind-session.md"
    max_lines_per_file: 500
  # Verbatim copy of the external model-aware orchestration proposal (0.3.x
  # source material). Kept byte-for-byte so it can be diffed against the
  # original; splitting it would break that. Slices are tracked in
  # docs/design-notes/v0-3-0-orchestration-slices.md.
  - name: orchestration_proposal_verbatim
    file_globs:
      - "docs/design-notes/model-aware-orchestration-proposal.md"
    max_lines_per_file: 1100
  # Verbatim Claude run of the proposal's §7.2 model-research prompt, kept
  # byte-for-byte beside the ChatGPT run (proposal §7.4) as input for future
  # merges. The merged, canonical profiles live in specy_road/templates/project/model-profiles/.
  - name: model_research_claude_verbatim
    file_globs:
      - "docs/design-notes/model-research-*-claude.md"
    max_lines_per_file: 900

roadmap_manifest_max_lines: 500
roadmap_json_chunk_max_lines: 500
