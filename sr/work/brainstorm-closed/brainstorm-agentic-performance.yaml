version: 2
slug: agentic-performance
topic: How should specy-road make its CLI-driven agent orchestration faster and better
  coordinated, in keeping with its philosophy?
under: null
mode: roadmap
round: 2
rounds: 2
profile: technical
panel: 2
count: 20
frame:
  outcome: 'assumed: a roadmap leaf moves from pickup to finish with less dead time
    and fewer wasted tokens, and a maintainer can see from tracked files alone where
    each leaf''s time and cost went; all without specy-road calling a model, running
    a daemon or serving MCP. (Neutralised: what dead time actually exists per leaf,
    and what would show the loop is already fast enough?)'
  metric: 'assumed: active wall-clock per leaf by phase; tokens and cost per role
    and model; coordination latency between an event being written and the coordinator
    observing it; count of specy-road shell invocations per leaf. None measured today.'
  served: 'assumed: solo maintainers and small teams running coordinator, executor
    and reviewer sessions across Claude Code, Codex and Cursor, plus the coding agents
    themselves. Not served: teams wanting a hosted orchestration platform, an API-level
    agent framework, or an LLM router in the coordination loop.'
  assumed-vs-known: 'known: inference is usually not the dominant cost of an agent
    task (seed article). assumed: polling dead time and harness cold start dominate
    a specy-road leaf (unmeasured); per-role effort reduction does not cost review
    quality (untested); adopters run headless workers at all rather than only IDE-driven
    loops (unknown). (Neutralised: what would disconfirm each?)'
  tried: 'nothing stopped. Already in place: sync returns only unacknowledged events;
    resume re-passes permission mode and output format; Claude cost and Codex usage
    land in event detail; grind-session computes parallel waves. Absent: timing instrumentation,
    per-role effort, discovery-mode pinning, blocking wait, wave fan-out, output caps.'
  fixed-or-choice: no daemon (D3) is fixed, but a foreground wait inside one CLI call
    is a choice; full-harness discovery for workers is a design intent that becomes
    a choice once claude -p defaults to bare; one Python process per specy-road command
    is a choice; one worker per leaf is a choice.
  not-the-question: if human review wait dwarfs everything else, or adopters mostly
    drive loops from an IDE chat without headless workers, then speeding the worker
    loop is the wrong target and the question is about the review packet or the IDE
    loop instead; also wrong if the real ask is a hosted platform, which the constitution
    rules out.
  do-nothing: Claude Code flips -p to bare mode and workers silently lose skills,
    hooks and MCP; token cost per leaf stays invisible so nobody can tell cheap configurations
    from expensive ones; the polling gap scales with fan-out.
  budget: maintainer time on the 0.3 line in small leaves; no new daemon, MCP server,
    model call, vendor SDK dependency or resident process; version numbers human-owned.
allocation: 's1: Failure modes x technical layers, Ordinary personas, 6

  s2: Platform leverage x a competing team''s PM, Analogical transfer, 6

  Operability x user segments, Random constraints (no network; one engineer; must
  be free), 4

  Migration paths x technical layers, Low typicality, 3

  Debt and leverage x technical layers, Unoccupied regions, 3

  Dependency risk x risk and compliance, Low typicality, 3

  Security and compliance x business model, Ordinary personas, 2

  Failure modes x business model (cost and budget), Random constraints, 2'
