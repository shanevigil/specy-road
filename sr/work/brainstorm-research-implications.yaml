version: 2
slug: research-implications
topic: What do the PM-role and agent-context research findings mean for specy-road?
under: null
mode: roadmap
round: 2
rounds: 2
profile: product
panel: 2
frame:
  outcome: Teams using specy-road can tell whether what they shipped mattered, and
    their agents waste fewer turns on wrong or missing context, without more paperwork;
    and specy-road itself keeps adapting as models and best practices change
  metric: share of shipped work with a recorded result; agent turns and cost per task
    in sandbox runs; first-round review approval rate; share of agent context-reports
    that reproduce; how stale the shipped agent guidance is relative to current vendor
    guidance
  served: 'small-to-medium teams, including one person who is both dev and PM, and
    teams with several PMs; plus the coding agents doing the work. Not served: large
    product orgs whose analytics, experimentation and discovery tools specy-road should
    not replace'
  assumed: adopters care whether shipped work achieved anything (assumed); context
    quality changes agent outcomes (measured, mixed); people will record outcomes
    at all (unknown, main paperwork risk)
  tried: AGENTS block trimmed 83->39 lines then grew to 50 with lean rules; brainstorm
    hypothesis field exists but is never read after promote; agent headers on docs;
    ad-hoc deep-research prompts run by the maintainer. Nothing stopped yet
  fixed-but-a-choice: specy-road is only a delivery-coordination tool; the CLI never
    calls a model (true for now, could change later); acceptance is the definition
    of done; context ships as one fixed managed section; there is a single PM (there
    may be many, or one dev-PM)
  not-the-question: if rc1 adopters' real pain is elsewhere (install, upgrade, review
    gate); this line is kept separate from the 0.3.1-rc1 evaluation and its fixes
  do-nothing-for-a-year: the managed guidance goes stale against new models and harnesses,
    and specy-road becomes a faster feature factory with no way to show otherwise;
    the maintainer's deep-research process needs to become a regular, repeatable practice
  neutralised: What problem would outcome fields solve that the team's analytics tool
    does not, and what would show they are paperwork? Does the managed section need
    to shrink or to be measured first, and what would show a line does harm? Is the
    PM role shifting to strategy, and does specy-road need to follow either way? What
    would a regular research cadence change that ad-hoc research does not?
allocation: 's1 (sub-agent, unread research): 2 lenses of its choice x user segments/technical
  layers, operator=ordinary personas, quota 15 | s2 (sub-agent, unread research):
  2 lenses x business model/risk, operator=random constraints, quota 15 | coordinator
  (has read the research): Pre-mortem x risk & compliance, operator=analogical transfer,
  4 | Analogous domains x technical layers, operator=analogical transfer, 4 | SCAMPER
  x business model, operator=low typicality, 3 | Constraint removal x competing team''s
  PM, operator=unoccupied regions, 3 | Jobs to be done x user segments (dev-PM, many
  PMs), operator=ordinary personas, 3 | 10x/0.1x x technical layers, operator=random
  constraints, 3 — total >= 50'
