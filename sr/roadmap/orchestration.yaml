# Who may coordinate, execute, and review leaves of the toolkit's own roadmap.
# Read by the gate from origin/WIP/improvements-0-3-1 (this checkout points
# origin/HEAD at that line: `git remote set-head origin WIP/improvements-0-3-1`).
version: 1
roster:
  - id: human
    family: human
    roles: [coordinator, reviewer]
  - id: claude-opus-5.5
    family: anthropic
    roles: [coordinator, executor]
    profile: model-profiles/anthropic-claude/claude-opus-5-5.md
    harness: claude-code
    harness_model: claude-opus-5-5
    billing_route: claude_subscription
    channels:
      cli: '"${SPECY_ROAD_TOOLS:-$(git rev-parse --git-common-dir)/../sr/tools}/claude-worker.sh" {session} {prompt}'
  - id: claude-fable-5-1
    family: anthropic
    roles: [executor]
    harness: claude-code
    billing_route: claude_subscription
    channels:
      cli: '"${SPECY_ROAD_TOOLS:-$(git rev-parse --git-common-dir)/../sr/tools}/fable-worker.sh" {session} {prompt}'
  - id: claude-opus-5-5-high
    family: anthropic
    roles: [executor]
    profile: model-profiles/anthropic-claude/claude-opus-5-5.md
    harness: cursor
    billing_route: cursor_subscription
  - id: grok-4.7-high
    family: xai
    roles: [reviewer]
    profile: model-profiles/spacexai-grok/grok-4.7.md
    harness: cursor
    harness_model: grok-4.7-high
    billing_route: cursor_subscription
    channels:
      cli: '"${SPECY_ROAD_TOOLS:-tools}/cursor-review.sh" --model grok-4.7-high {prompt}'
  - id: grok-4.7-low
    family: xai
    roles: [reviewer]
    profile: model-profiles/spacexai-grok/grok-4.7.md
    harness: cursor
    harness_model: grok-4.7-low
    # Same wrapper as cursor-grok-4.6-high: cursor-review.sh runs agent --model grok-4.7-low (explicit, Auto off).
    # Set by the coordinator on the maintainer instruction to use light reviewers (2026-11-04); maintainer to confirm.
    pinned: true
    billing_route: cursor_subscription
    # Low reasoning effort for faster reviews (maintainer, 2026-11-04).
    channels:
      cli: '"${SPECY_ROAD_TOOLS:-$(git rev-parse --git-common-dir)/../sr/tools}/cursor-review.sh" grok-4.7-low {prompt}'
  - id: gpt-6.1-sol-low
    family: openai
    roles: [reviewer]
    profile: model-profiles/openai-gpt/gpt-6.1-sol.md
    harness: codex
    harness_model: gpt-6.1-sol
    # Low reasoning effort for faster reviews (maintainer, 2026-11-04). Wrapper until M8.3 lands, as for gpt-6.1-sol.
    channels:
      cli: '"${SPECY_ROAD_TOOLS:-$(git rev-parse --git-common-dir)/../sr/tools}/codex-review.sh" gpt-6.1-sol {prompt} low'
  - id: claude-opus-5-5-review
    family: anthropic
    roles: [reviewer]
    profile: model-profiles/anthropic-claude/claude-opus-5-5.md
    harness: claude-code
    channels:
      cli: '"${SPECY_ROAD_TOOLS:-$(git rev-parse --git-common-dir)/../sr/tools}/claude-review.sh" medium {prompt}'
  - id: gpt-6.1-sol
    family: openai
    roles: [reviewer]
    harness: codex
    harness_model: gpt-6.1-sol
    # M8.3 (Codex's native read-only reviewer + post-run write check) is deferred and not on WIP, so without
    # channels.cli Codex runs workspace-write without the main checkout's sr/work/reviews and cannot file.
    # Use the wrapper (adds --add-dir $REVIEWS) until M8.3 lands; then drop channels.cli again (its write
    # check counts the wrapper's Linux bwrap mount points as reviewer writes).
    channels:
      cli: '"${SPECY_ROAD_TOOLS:-$(git rev-parse --git-common-dir)/../sr/tools}/codex-review.sh" gpt-6.1-sol {prompt}'
  - id: gpt-5.6-sol-medium
    family: openai
    roles: [reviewer]
    harness: codex
    channels:
      cli: '"${SPECY_ROAD_TOOLS:-$(git rev-parse --git-common-dir)/../sr/tools}/codex-review.sh" gpt-5.6-sol {prompt} medium'
  - id: gpt-5.6-sol-low
    family: openai
    roles: [reviewer]
    harness: codex
    channels:
      cli: '"${SPECY_ROAD_TOOLS:-$(git rev-parse --git-common-dir)/../sr/tools}/codex-review.sh" gpt-5.6-sol {prompt} low'
  - id: cursor-grok-4.6-high
    family: xai
    roles: [reviewer]
    profile: model-profiles/spacexai-grok/grok-4.6.md
    harness: cursor
    harness_model: cursor-grok-4.6-high
    # The wrapper runs `agent --model cursor-grok-4.6-high` with Auto off (sr/tools/cursor-review.sh);
    # checked by the maintainer 2026-11-04, so the approval counts as xai (M11.33 routing rule).
    pinned: true
    channels:
      cli: '"${SPECY_ROAD_TOOLS:-$(git rev-parse --git-common-dir)/../sr/tools}/cursor-review.sh" cursor-grok-4.6-high {prompt}'
  - id: grok-4.7-exec
    family: xai
    roles: [executor]
    profile: model-profiles/spacexai-grok/grok-4.7.md
    harness: cursor
    harness_model: grok-4.7-high
    billing_route: cursor_subscription
    # Overflow executor while the Claude account is at its usage limit (maintainer, 2026-11-05).
    # Temporary --force opt-in (decision D8, M16.69): Cursor's sandbox does not start on this host (AppArmor).
    cursor_force: true
  - id: composer-2.5
    family: cursor
    roles: [executor]
    harness: cursor
    # Temporary --force opt-in (decision D8, M16.69): Cursor's sandbox does not start on this host (AppArmor).
    cursor_force: true
  - id: gpt-5.6-sol-high
    family: openai
    roles: [reviewer]
    harness: cursor
    harness_model: gpt-5.6-sol-high
    billing_route: cursor_subscription
    channels:
      cli: '"${SPECY_ROAD_TOOLS:-tools}/cursor-review.sh" --model gpt-5.6-sol-high {prompt}'
policy:
  reviewers_required: 2
  reviewers_distinct_families: true
  reviewer_fresh_session: true
  signed_reviews: false
  reviewer_reruns_required: true
  max_workers: 20
  # Baseline files a leaf may only shrink; `specy-road integrity` reports any it adds lines to.
  ratchet_paths:
    - constraints/clone-baseline.json
    - constraints/test-private-imports-baseline.txt
    - constraints/mutation-baseline.json
    - constraints/file-limits.yaml
substitutions: []
