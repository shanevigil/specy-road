  - id: D3
    node: M11.72
    kind: decision
    summary: May Cursor Composer act as the second reviewer when every OpenAI reviewer
      is over its limit?
    why_now: Codex Sol hit its usage limit at about 02:50 Tuesday (resets 23:58) and
      Cursor Sol is out until 6 November. Leaves written by Opus can't use the Opus
      reviewer (same family), so eight of them wait about 21 hours for Sol. New pickups
      switched to Composer executors meanwhile (reviewed by Grok + Opus).
    options:
      - label: allow
        effect: Add the reviewer role to composer-2.5 (cursor family) as a fallback
          second reviewer beside Grok for Opus-written leaves while OpenAI is limited;
          reviews resume now, with a weaker second reviewer.
      - label: wait
        effect: Keep the gate as is; the Opus leaves are reviewed by Sol after the
          reset (a timed pass is queued for 23:59).
    recommendation: wait
    recommendation_reason: Composer missed defects as an executor that Opus and Sol
      caught; using it as the only non-xAI reviewer would weaken the gate, and the
      backlog can drain on Composer executors meanwhile.
    default_if_unanswered: wait (the 23:59 Sol pass runs)
    asked: '2026-11-03'
    status: closed
    answer: 'superseded: the maintainer chose a mix of the Opus reviewer and Codex
      Sol as second reviewers (2026-11-03); Composer was not used as a reviewer'
    closed: '2026-11-03T19:29:35+00:00'
  - id: D4
    node: M8.2
    kind: decision
    summary: 'Bound M8.2''s A3 (post-run check) to the RCA-8 text: one post_run_check
      per turn, defined turn kinds, defined stream and git findings; an index-only
      (XY) change is out of scope'
    why_now: Four openai blocks on A3, each a new porcelain class; RCA-8 (work/reviews/M8.2/RCA-8.md)
      classifies it as a specification gap and proposes bounded text. Blocks M8.2
      from landing.
    options:
      - label: approve
        effect: Replace A3 with the RCA-8 proposed text (A1, A2 unchanged); the current
          commit already meets it, so after the pending WIP merge it goes to re-review
      - label: reject
        effect: Keep A3 open-ended; another fix round records XY-only stages and Sol
          may find a narrower class
    recommendation: approve
    recommendation_reason: No porcelain comparison can enumerate every git state transition;
      the bounded text names the classes that matter (content, path membership, early
      exits) and excludes index-only changes
    default_if_unanswered: hold M8.2 until answered
    asked: '2026-11-03'
    status: closed
    needed_by: '2026-11-03'
    answer: 'approve: A3 replaced with the RCA-8 bounded text (one post_run_check
      per turn; defined turn kinds, stream and git findings; index-only changes out
      of scope) (maintainer, 2026-11-03)'
    closed: '2026-11-03T23:30:15+00:00'
  - id: D5
    node: M6
    kind: decision
    summary: Ship 0.3.1rc3 to TestPyPI with the first context-regression replay's
      Codex and Cursor failures documented as known limitations, or hold rc3 until
      they pass
    why_now: 'First-ever replay of docs/context-regressions.yaml (work/context-regressions-2026-11-04.md):
      Claude Code passed all 10 cases; Cursor failed CR1 (forged approvals, 3/3),
      CR3, CR5, CR9; Codex failed CR5, CR9, CR10. The runbook''s failure rule makes
      each a FAIL that blocks the rc. No earlier replay exists, so none is a regression
      since rc2. Blocks the rc3 tag and publish only.'
    options:
      - label: ship
        effect: Tag and publish 0.3.1rc3 to TestPyPI; the CHANGELOG and whats-new
          state that unattended executors are supported on Claude Code only and list
          the Codex/Cursor failures; specy-road-side hardening that lands today ships
          in rc3, the rest goes to rc4
      - label: hold
        effect: No tag until every case passes on every listed harness; triage and
          fixes continue; rc3 waits, possibly days, since several failures are model
          behaviour specy-road cannot change
    recommendation: ship
    recommendation_reason: These are first measurements of harness behaviour, not
      regressions from rc2; a TestPyPI release candidate exists to get exactly this
      kind of evidence in front of testers; holding blocks the 167-leaf rc3 on Cursor
      and Codex model behaviour
    default_if_unanswered: hold the tag; finish every other release step so publishing
      takes minutes once answered
    asked: '2026-11-04'
    status: closed
    needed_by: '2026-11-04'
    answer: 'hold: no rc3 tag or publish for now; pre-release checks and fixes continue
      on WIP/pre-release-checks (maintainer, 2026-11-04)'
    closed: '2026-11-04T17:18:18+00:00'
