version: 1
entries:
  - id: D1
    node: M11.51
    kind: decision
    summary: Bound the dashboard's safe-save rule to one hash check before each write
    why_now: Sol blocked the dashboard safe-save leaf three times, each on a narrower
      race against editors outside the dashboard; the root-cause analysis (work/reviews/M11.51/RCA-3.md)
      says the criterion is unbounded. Blocks M11.51 from landing.
    options:
      - label: approve
        effect: 'Replace A1 with the bounded text: GET and successful PUT return the
          hash of the bytes read or written; a stale X-Base-Content-Hash gets 409
          and nothing is written; edits after that one check, a second check and file
          locks against other writers are out of scope. The current commit already
          meets it; it goes straight to re-review.'
      - label: reject
        effect: Keep A1 open-ended; another fix round adds a serialized write with
          a re-check before an atomic replace, and Sol may still find a narrower window.
    recommendation: approve
    recommendation_reason: No file-level check can stop a writer that does not cooperate;
      the bounded rule covers the real case (the dashboard overwriting edits it never
      saw).
    default_if_unanswered: hold M11.51 until answered
    asked: '2026-11-02'
    status: open
  - id: D2
    node: M1.1
    kind: decision
    summary: Version number for promoting the 0.3.1 line to main
    why_now: Promotion to main needs an exact version from the maintainer (version
      numbers are human-owned). Maintainer (2026-11-03): decide at rc4, expected to be
      the last release candidate (a final feedback round) before the 0.3.1 release.
    options:
      - label: 0.3.1
        effect: Final release of this line after the release candidates.
      - label: other
        effect: Name the exact version.
    recommendation: 0.3.1
    recommendation_reason: Matches the rc line (0.3.1rcN).
    default_if_unanswered: do not promote
    asked: '2026-11-02'
    status: open
  - id: D3
    node: M11.72
    kind: decision
    summary: May Cursor Composer act as the second reviewer when every OpenAI reviewer
      is over its limit?
    why_now: Codex Sol hit its usage limit at about 02:50 Tuesday (resets 23:58) and
      Cursor Sol is out until 6 November. Leaves written by Opus can't use the Opus
      reviewer (same family), so eight of them wait about 21 hours for Sol. New pickups
      switched to Composer executors meanwhile (reviewed by Grok + Opus).
    options:
      - label: allow
        effect: Add the reviewer role to composer-2.5 (cursor family) as a fallback
          second reviewer beside Grok for Opus-written leaves while OpenAI is limited;
          reviews resume now, with a weaker second reviewer.
      - label: wait
        effect: Keep the gate as is; the Opus leaves are reviewed by Sol after the
          reset (a timed pass is queued for 23:59).
    recommendation: wait
    recommendation_reason: Composer missed defects as an executor that Opus and Sol
      caught; using it as the only non-xAI reviewer would weaken the gate, and the
      backlog can drain on Composer executors meanwhile.
    default_if_unanswered: wait (the 23:59 Sol pass runs)
    asked: '2026-11-03'
    status: open
